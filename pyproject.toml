[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decision-api-tests"
version = "0.1.0"
description = "Interactive, reproducible choice benchmarks for decision APIs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0.2,<7",
  "questionary>=2.1,<3",
  "rich>=14,<15",
  "uvicorn>=0.34,<1",
]

[project.scripts]
decision-tests = "decision_tests.cli:main"
decision-web = "decision_tests.web:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

